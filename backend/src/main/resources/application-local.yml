app:
  environment: local

spring:
  datasource:
    url: >-
      jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:dataflow}
      ?useUnicode=true
      &characterEncoding=utf8
      &useSSL=false
      &allowPublicKeyRetrieval=true
      &serverTimezone=Asia/Shanghai

    username: ${MYSQL_USERNAME:dataflow}
    password: ${MYSQL_PASSWORD}

    hikari:
      pool-name: DataFlowHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000

logging:
  level:
    com.pony.dataflow: DEBUG

management:
  endpoint:
    health:
      show-details: always